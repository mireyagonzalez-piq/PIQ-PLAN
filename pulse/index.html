/* ─── Date & data helpers (recovered) ──────────────────────── */
function currentWeekStart(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
}
function weekLabel(d){
  return `${d.getMonth()+1}/${d.getDate()}`;
}
const MONTHS_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseWeekStart(raw){
  if(!raw) return null;
  const t = String(raw).trim();
  let m = t.match(/^([A-Za-z]+)\s+(\d{1,2})/);
  if(m){
    const mi = MONTHS_IDX[m[1].toLowerCase().slice(0,3)];
    const day = parseInt(m[2]);
    if(mi !== undefined && !isNaN(day)){
      const year = mi === 11 ? 2025 : 2026;
      return new Date(year, mi, day);
    }
  }
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    const [,mo,dy,yr] = m;
    const year = yr.length===2 ? 2000+parseInt(yr) : parseInt(yr);
    return new Date(year, parseInt(mo)-1, parseInt(dy));
  }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  const num = parseFloat(t);
  if(!isNaN(num) && num > 1000){
    const base = new Date(1899,11,30);
    base.setDate(base.getDate()+num);
    return base;
  }
  const d = new Date(t);
  return isNaN(d.getTime()) ? null : d;
}
function toNum(v){
  if(v === '' || v === null || v === undefined) return 0;
  const s = String(v).replace(/,/g,'').replace(/[^0-9.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function distinctWeeks(rows){
  const m = new Map();
  rows.forEach(r => { const t = r.weekStart.getTime(); if(!m.has(t)) m.set(t, r.weekStart); });
  return Array.from(m.values()).sort((a,b)=>a-b);
}
function lastFullWeeks(rows, n){
  if(!rows.length) return [];
  const now = currentWeekStart().getTime();
  const past = rows.filter(r => r.weekStart.getTime() < now);
  const weeks = distinctWeeks(past);
  const keep = new Set(weeks.slice(-n).map(w=>w.getTime()));
  return past.filter(r => keep.has(r.weekStart.getTime()));
}
function customRange(rows, from, to){
  const start = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const end = new Date(to.getFullYear(), to.getMonth(), to.getDate(), 23,59,59);
  return rows.filter(r => {
    const t = r.weekStart.getTime();
    return t >= start.getTime() && t <= end.getTime();
  });
}
function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(key){

  return new Date(parseInt(y), parseInt(m)-1, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}

}

async function fetchPIQData(){
  const res = await fetch(APPS_SCRIPT_URL);
  if(!res.ok) throw new Error(`Failed to fetch data: ${res.status}`);
  const raw = await res.json();
  const facts = raw
    .filter(r => r.Client && r.AM)
    .filter(r => String(r.Client).trim().toLowerCase() !== 'kasbah ai')
    .map(r => ({
      weekStart: parseWeekStart(r['Week Start (Mon)']),
      emailUser: r['PIQ Email User'] || '',
      client: String(r.Client).trim(),
      am: String(resolveAM(r.Client, r.AM) || '').trim(),
      status: String(r.Status || '').trim(),
      vertical: String(r.Vertical || r.vertical || '').trim(),
      leadSource: String(r['Lead Source'] || '').trim(),
      sent: toNum(r.Sent),
      opens: toNum(r.Opens),
      replies: toNum(r.Replies),
      pos: toNum(r.Pos),
      meetings: toNum(r.Meetings),
    }))
    .filter(r => r.weekStart !== null);
  return { facts };
}

/* ─── Aggregations (recovered) ─────────────────────────────── */
function verticalRollup(rows){
  const t = {};
  rows.forEach(r => {
    const v = (r.vertical||'').trim();
    if(!v) return;
    const g = mapVertical(v);
    if(!t[g]) t[g] = {vertical:g, sent:0, replies:0, pos:0, meetings:0, clients:new Set()};
    t[g].sent += r.sent; t[g].replies += r.replies; t[g].pos += r.pos; t[g].meetings += r.meetings;
    t[g].clients.add(r.client);
  });
  return Object.values(t).map(g => ({
    ...g,
    clientCount: g.clients.size,
    replyRate: g.sent>0 ? parseFloat((g.replies/g.sent*100).toFixed(1)) : 0,
  })).sort((a,b)=>b.meetings-a.meetings);
}
function amRollup(rows){
  const t = {};
  AMS.forEach(am => { t[am] = null; });
  rows.forEach(r => {
    const k = r.am;
    if(!t.hasOwnProperty(k)) return;
    if(!t[k]) t[k] = {clients:{}};
    if(!t[k].clients[r.client]) t[k].clients[r.client] = {client:r.client, replies:0, pos:0, meetings:0};
    t[k].clients[r.client].replies += r.replies;
    t[k].clients[r.client].pos += r.pos;
    t[k].clients[r.client].meetings += r.meetings;
  });
  const out = {};
  AMS.forEach(am => {
    const v = t[am];
    if(!v) return;
    const all = Object.values(v.clients).sort((a,b)=>(b.replies+b.pos+b.meetings)-(a.replies+a.pos+a.meetings));
    const tot = {replies:0,pos:0,meetings:0};
    rows.filter(r=>r.am===am).forEach(r=>{tot.replies+=r.replies;tot.pos+=r.pos;tot.meetings+=r.meetings;});
    const top = all[0] || {client:'N/A',replies:0,pos:0,meetings:0};
    out[am] = {
      am, topClient: top.client, topClientReplies: top.replies, topClientPos: top.pos, topClientMeetings: top.meetings,
      totalReplies: tot.replies, totalPos: tot.pos, totalMeetings: tot.meetings,
      replySharePct: tot.replies>0 ? Math.round(top.replies/tot.replies*100) : 0,
      posSharePct: tot.pos>0 ? Math.round(top.pos/tot.pos*100) : 0,
      meetingSharePct: tot.meetings>0 ? Math.round(top.meetings/tot.meetings*100) : 0,
      allClients: all,
    };
  });
  return out;
}
function clientMeta(allFacts, client){
  const rows = allFacts.filter(r => r.client === client);
  if(!rows.length) return {};
  const last = rows[rows.length-1];
  return { am: last.am, vertical: last.vertical, status: last.status };
}
function buildAnalystContext(rows){
  const per = {}; AMS.forEach(a=>per[a]={sent:0,replies:0,pos:0,meetings:0,clients:new Set()});
  const verts = {};
  rows.forEach(r => {
    if(per[r.am]){ per[r.am].sent+=r.sent; per[r.am].replies+=r.replies; per[r.am].pos+=r.pos; per[r.am].meetings+=r.meetings; per[r.am].clients.add(r.client); }
    const v = mapVertical((r.vertical||'').trim());
    if(v){ if(!verts[v]) verts[v]={sent:0,replies:0,pos:0,meetings:0}; verts[v].sent+=r.sent; verts[v].replies+=r.replies; verts[v].pos+=r.pos; verts[v].meetings+=r.meetings; }
  });
  const tot = {sent:0,replies:0,pos:0,meetings:0};
  AMS.forEach(a=>{tot.sent+=per[a].sent;tot.replies+=per[a].replies;tot.pos+=per[a].pos;tot.meetings+=per[a].meetings;});
  const perLines = AMS.map(a=>{
    const u=per[a];
    const rr=u.sent>0?(u.replies/u.sent*100).toFixed(2):'0.00';
    const mr=u.sent>0?(u.meetings/u.sent*100).toFixed(3):'0.000';
    const pm=u.pos>0?(u.meetings/u.pos*100).toFixed(1):'N/A';
    return `${a}: ${u.meetings} MB, ${u.pos} PRs, ${u.replies} replies from ${u.sent.toLocaleString()} sent (reply rate ${rr}%, MB rate ${mr}%, PRs→MB ${pm}%, ${u.clients.size} clients)`;
  }).join('\n');
  const vertLines = Object.entries(verts).map(([v,u])=>({v,...u,mbRate:u.sent>0?u.meetings/u.sent*100:0}))
    .sort((a,b)=>b.meetings-a.meetings).slice(0,15)
    .map(u=>`${u.v}: ${u.meetings} MB, ${u.sent.toLocaleString()} sent, MB rate ${u.mbRate.toFixed(3)}%`).join('\n');
  const avgMB = tot.meetings / AMS.filter(a=>per[a].sent>0).length;
  return `TEAM SUMMARY (filtered period):
Total: ${tot.meetings} MB, ${tot.pos} PRs, ${tot.replies} replies, ${tot.sent.toLocaleString()} emails sent
Team avg MB per AM: ${avgMB.toFixed(1)}
Overall reply rate: ${tot.sent>0?(tot.replies/tot.sent*100).toFixed(2):0}%
Overall MB rate: ${tot.sent>0?(tot.meetings/tot.sent*100).toFixed(3):0}%

PER-AM BREAKDOWN:
${perLines}

TOP VERTICALS BY MEETINGS:
${vertLines}`;
}

const ZOOM_INFO = 'zoom info';
const NOT_SPECIFIED = 'Not specified';
function isZoomInfo(s){ return String(s||'').trim().toLowerCase() === ZOOM_INFO; }
function fmtPct1(n){ return `${n.toFixed(1)}%`; }
function blankAgg(){ return {sent:0,replies:0,pos:0,meetings:0}; }
function dedupeRows(rows){
  const seen = new Set(); const out = [];
  for(const r of rows){
    const k = `${r.client}|${r.weekStart ? r.weekStart.getTime() : ''}|${r.sent}`;
    if(!seen.has(k)){ seen.add(k); out.push(r); }
  }
  return out;
}
function sourceRollup(rows){
  const t = new Map();
  for(const r of rows){
    const src = String(r.leadSource||'').trim() || NOT_SPECIFIED;
    if(!t.has(src)) t.set(src, blankAgg());
    const a = t.get(src);
    a.sent += r.sent||0; a.replies += r.replies||0; a.pos += r.pos||0; a.meetings += r.meetings||0;
  }
  return Array.from(t.entries()).map(([source,a])=>({
    source, ...a,
    replyRate: a.sent ? a.replies/a.sent*100 : 0,
    isZoomInfo: source.toLowerCase() === ZOOM_INFO,
    isNotSpecified: source === NOT_SPECIFIED,
  })).sort((a,b)=> a.isZoomInfo ? -1 : b.isZoomInfo ? 1 : (a.isNotSpecified !== b.isNotSpecified) ? (a.isNotSpecified ? 1 : -1) : b.sent - a.sent);
}
function zoomInfoRollup(rows){
  const ziClients = new Set(rows.filter(r=>isZoomInfo(r.leadSource)).map(r=>r.client));
  const m = new Map();
  for(const r of rows){
    if(!ziClients.has(r.client)) continue;
    if(!m.has(r.client)) m.set(r.client, {client:r.client, am:r.am, zoom:blankAgg(), all:blankAgg()});
    const e = m.get(r.client);
    e.all.sent += r.sent||0; e.all.replies += r.replies||0; e.all.pos += r.pos||0; e.all.meetings += r.meetings||0;
    if(isZoomInfo(r.leadSource)){ e.zoom.sent += r.sent||0; e.zoom.replies += r.replies||0; e.zoom.pos += r.pos||0; e.zoom.meetings += r.meetings||0; }
  }
  return Array.from(m.values()).map(e=>({
    ...e,
    zoomReplyRate: e.zoom.sent ? e.zoom.replies/e.zoom.sent*100 : 0,
    allReplyRate: e.all.sent ? e.all.replies/e.all.sent*100 : 0,
  })).sort((a,b)=>b.zoom.sent-a.zoom.sent);
}

/* ─── GlockApps data (recovered) ───────────────────────────── */
async function fetchGlockAppsResults(){
  const res = await fetch(`${GA_APPS_SCRIPT_URL}?type=glockapps`);
  if(!res.ok) throw new Error(`Could not load GlockApps results (HTTP ${res.status})`);
  const raw = await res.json();
  if(raw && raw.error) throw new Error(raw.error);
  return raw.map(row => {
    const missingPct = Number(row['Missing %']) || 0;
    const inboxPct = Number(row['Inbox %']) || 0;
    const spamPct = Number(row['Spam %']) || 0;
    const allZero = inboxPct===0 && spamPct===0 && missingPct===0;
    return {
      testDate: row['Test Date'] || '',
      testType: row['Test Type'] || '',
      domain: row.Domain || '',
      mailboxes: (row['Mailboxes Tested']||'').split(/\s+/).map(s=>s.trim()).filter(Boolean),
      inboxPct, spamPct, missingPct,
      glockAppsLink: row['GlockApps Link'] || '',
      notes: row.Notes || '',
      testKey: row['Test Key'] || '',
      testMonth: row['Test Month'] || '',
      piqUser: row['PIQ Email User'] || '',
      client: row.Client || 'Unassigned',
      am: resolveAM(row.Client, row.AM || 'Unassigned'),
      domainCheck: row['Domain Check'] || '',
      mailboxCount: Number(row['Mailbox Count']) || 0,
      duplicate: !!row.Duplicate,
      inProgress: missingPct >= IN_PROGRESS_MISSING_THRESHOLD || allZero,
    };
  });
}
function buildClientSummaries(tests){
  const byClient = new Map();
  for(const t of tests){
    if(!byClient.has(t.client)) byClient.set(t.client, {client:t.client, am:t.am, tests:[], weightedMailboxes:0, weightedInbox:0, weightedSpam:0, weightedMissing:0, lastTestDate:t.testDate});
    const c = byClient.get(t.client);
    c.tests.push(t);
    if(new Date(t.testDate) > new Date(c.lastTestDate)) c.lastTestDate = t.testDate;
    if(!t.inProgress){
      const w = t.mailboxCount || 1;
      c.weightedMailboxes += w;
      c.weightedInbox += t.inboxPct * w;
      c.weightedSpam += t.spamPct * w;
      c.weightedMissing += t.missingPct * w;
    }
  }
  return Array.from(byClient.values()).map(c=>{
    const completed = c.tests.filter(t=>!t.inProgress);
    const running = c.tests.filter(t=>t.inProgress);
    return {
      client:c.client, am:c.am,
      domainCount: new Set(c.tests.map(t=>t.domain)).size,
      testCount: c.tests.length,
      completedCount: completed.length,
      inProgressCount: running.length,
      lastTestDate: c.lastTestDate,
      avgInbox: c.weightedMailboxes ? c.weightedInbox/c.weightedMailboxes : 0,
      avgSpam: c.weightedMailboxes ? c.weightedSpam/c.weightedMailboxes : 0,
      avgMissing: c.weightedMailboxes ? c.weightedMissing/c.weightedMailboxes : 0,
      tests: [...c.tests].sort((a,b)=>new Date(b.testDate)-new Date(a.testDate)),
    };
  }).sort((a,b)=>b.avgSpam-a.avgSpam);
}
function buildDomainBreakdown(tests){
  const m = new Map();
  for(const t of tests){ if(!m.has(t.domain)) m.set(t.domain, []); m.get(t.domain).push(t); }
  return Array.from(m.entries()).map(([domain, ts])=>({domain, tests: ts.sort((a,b)=>new Date(b.testDate)-new Date(a.testDate))}));
}
function pct1(n){ return `${n.toFixed(1)}%`; }
function inboxColor(n){ return n>=70 ? 'text-emerald-600' : n>=40 ? 'text-amber-600' : 'text-red-600'; }
function spamColor(n){ return n<=15 ? 'text-emerald-600' : n<=40 ? 'text-amber-600' : 'text-red-600'; }
function domainAction(inboxPct){
  return inboxPct < INBOX_REPLACE_BELOW ? 'replace' : inboxPct < INBOX_HALFVOLUME_BELOW ? 'half-volume' : 'ok';
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(Number.isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

/* ─── Small fetch hook (replaces react-query) ──────────────── */
function useFetch(key, fn, staleMs){
  const [state, setState] = useState({data:null, isLoading:true, error:null, isRefetching:false});
  const fnRef = useRef(fn); fnRef.current = fn;
  const lastAt = useRef(0);
  const load = useCallback(async (isRefetch)=>{
    setState(s => ({...s, isLoading: !isRefetch && s.data===null, isRefetching: !!isRefetch, error: isRefetch ? s.error : null}));
    try{
      const data = await fnRef.current();
      lastAt.current = Date.now();
      setState({data, isLoading:false, error:null, isRefetching:false});
    }catch(err){
      setState(s => ({...s, isLoading:false, isRefetching:false, error: err}));
    }
  },[]);
  useEffect(()=>{ load(false); }, [key]);
  const refetch = useCallback(()=> load(true), [load]);
  return {...state, refetch};
}

/* ─── Summary cards ────────────────────────────────────────── */
function SummaryCard({icon, label, value, sublabel}){
  return (
    <div className="bg-card border border-border rounded-xl p-5 flex flex-col gap-3">
      <div className="flex items-center gap-2.5">
        <div className="w-8 h-8 rounded-lg bg-secondary flex items-center justify-center"><Icon name={icon} className="w-4 h-4 text-muted-foreground"/></div>
        <span className="text-xs font-medium text-muted-foreground uppercase tracking-wider">{label}</span>
      </div>
      <div className="text-3xl font-bold text-foreground tracking-tight">{value}</div>
      {sublabel && <p className="text-xs text-muted-foreground leading-relaxed">{sublabel}</p>}
    </div>
  );
}
function SummaryCards({filteredFacts}){
  const per = {}; AMS.forEach(a=>per[a]={meetings:0,pos:0,replies:0,sent:0});
  let mb=0, pos=0, replies=0, sent=0;
  filteredFacts.forEach(r=>{
    mb+=r.meetings; pos+=r.pos; replies+=r.replies; sent+=r.sent;
    if(per[r.am]){ per[r.am].meetings+=r.meetings; per[r.am].pos+=r.pos; per[r.am].replies+=r.replies; per[r.am].sent+=r.sent; }
  });
  const leader = (k)=>{
    let best=null, val=-1;
    AMS.forEach(a=>{ if(per[a][k]>val){ val=per[a][k]; best=a; } });
    return best ? `${best} leads with ${val}` : '';
  };
  const rr = sent>0 ? (replies/sent*100).toFixed(1) : '0.0';
  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <SummaryCard icon="Calendar" label="MB (Meetings Booked)" value={mb} sublabel={leader('meetings')}/>
      <SummaryCard icon="Users" label="PRs (Positive Responses)" value={pos} sublabel={leader('pos')}/>
      <SummaryCard icon="MessageSquare" label="Total replies" value={`${replies}`} sublabel={`${rr}% reply rate`}/>
      <SummaryCard icon="Send" label="Emails sent" value={sent.toLocaleString()}/>
    </div>
  );
}

function TopPerformers({filteredFacts, allFacts, onClientClick, onAMClick, onVerticalClick, periodLabel}){
  if(!filteredFacts.length) return null;
  const weeks = distinctWeeks(filteredFacts);
  const half = Math.floor(weeks.length/2);
  const firstHalf = new Set(weeks.slice(0,half).map(w=>w.getTime()));
  const secondHalf = new Set(weeks.slice(half).map(w=>w.getTime()));
  const per = {};
  filteredFacts.forEach(r=>{
    if(!per[r.client]) per[r.client] = {client:r.client, meetings:0, sent:0, replies:0, firstMB:0, secondMB:0};
    const c = per[r.client];
    c.meetings+=r.meetings; c.sent+=r.sent; c.replies+=r.replies;
    if(firstHalf.has(r.weekStart.getTime())) c.firstMB += r.meetings;
    if(secondHalf.has(r.weekStart.getTime())) c.secondMB += r.meetings;
  });
  const topMB = Object.values(per).filter(c=>c.meetings>0).sort((a,b)=>b.meetings-a.meetings).slice(0,3);
  const topReply = Object.values(per).filter(c=>c.sent>=200).map(c=>({...c, rate:c.replies/c.sent})).sort((a,b)=>b.rate-a.rate).slice(0,3);
  const improved = Object.values(per).map(c=>({client:c.client, delta:c.secondMB-c.firstMB, meetings:c.meetings}))
    .filter(c=>c.delta>0).sort((a,b)=>b.delta-a.delta)[0] || null;
  const vert = {};
  filteredFacts.forEach(r=>{ const v=r.vertical||''; if(v) vert[v]=(vert[v]||0)+r.meetings; });
  const topVerts = Object.entries(vert).filter(([,m])=>m>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const amAgg = {};
  filteredFacts.forEach(r=>{ if(!amAgg[r.am]) amAgg[r.am]={meetings:0,replies:0}; amAgg[r.am].meetings+=r.meetings; amAgg[r.am].replies+=r.replies; });
  const topAM = Object.entries(amAgg).sort((a,b)=>b[1].meetings-a[1].meetings)[0] || null;
  return (
    <div className="rounded-2xl p-6 space-y-5" style={{background:'linear-gradient(135deg, #EEF3FF 0%, #f0faff 50%, #EEF3FF 100%)', border:'1.5px solid #bfcfff'}}>
      <div className="flex items-center gap-2">
        <Icon name="Trophy" className="w-5 h-5" style={{color:'#0047FF'}}/>
        <h2 className="text-base font-bold" style={{color:'#1A1A2E'}}>Top Performers</h2>
        <span className="ml-auto text-xs font-medium bg-white/60 px-2.5 py-1 rounded-full" style={{color:'#0047FF'}}>{periodLabel}</span>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
        {topMB.length>0 && <TopPerformerCard emoji="📅" label="Top by MB" name={topMB[0].client} value={`${topMB[0].meetings} MB`}
          sub={topMB.slice(1).map(c=>`${c.client} (${c.meetings})`).join(' · ')} color="#0047FF" onNameClick={onClientClick ? ()=>onClientClick(topMB[0].client) : undefined}/>}
        {topReply.length>0 && <TopPerformerCard emoji="📬" label="Best reply rate" name={topReply[0].client}
          value={topReply[0].sent ? (topReply[0].replies/topReply[0].sent*100).toFixed(1)+'%' : '0.0%'}
          sub={topReply.slice(1).map(c=>`${c.client} (${c.sent?(c.replies/c.sent*100).toFixed(1):'0.0'}%)`).join(' · ')} color="#00C2E0" onNameClick={onClientClick ? ()=>onClientClick(topReply[0].client) : undefined}/>}
        {improved && <TopPerformerCard emoji="🚀" label="Most improved" name={improved.client} value={`+${improved.delta} MB`}
          sub={`${improved.meetings} total MB in period`} color="#0047FF" onNameClick={onClientClick ? ()=>onClientClick(improved.client) : undefined}/>}
        {topAM && <TopPerformerCard emoji="⭐" label="Top AM" name={topAM[0]} value={`${topAM[1].meetings} MB`} sub={`${topAM[1].replies} replies`}
          color={AM_COLORS[topAM[0]]||'#059669'} onNameClick={onAMClick ? ()=>onAMClick(topAM[0]) : undefined}/>}
        {topVerts.length>0 && (
          <div className="flex flex-col gap-1.5 bg-white/70 rounded-xl p-4 border border-blue-200/60">
            <div className="flex items-center gap-1.5" style={{color:'#0047FF'}}>
              <span className="text-base">🏆</span>
              <span className="text-[10px] font-semibold uppercase tracking-wider">Top Verticals</span>
            </div>
            <div className="space-y-1 mt-0.5">
              {topVerts.map(([v, m])=>(
                <div key={v} className="flex items-center justify-between gap-1">
                  {onVerticalClick ? (
                    <button onClick={()=>onVerticalClick(v)} className="text-xs text-gray-800 font-medium truncate underline decoration-dotted transition-colors text-left"
                      onMouseEnter={e=>e.currentTarget.style.color='#0047FF'} onMouseLeave={e=>e.currentTarget.style.color=''}>{v}</button>
                  ) : <span className="text-xs text-gray-800 font-medium truncate">{v}</span>}
                  <span className="text-xs font-bold shrink-0" style={{color:'#0047FF'}}>{m} MB</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Time window controls ─────────────────────────────────── */
const TIME_WINDOWS = [{label:'Last week',value:1},{label:'Last 4 weeks',value:4},{label:'Last 8 weeks',value:8},{label:'Last 12 weeks',value:12}];
function TimeControls({timeWindow, setTimeWindow, onRefresh, isRefreshing, customFrom, setCustomFrom, customTo, setCustomTo, includeAllPhases, setIncludeAllPhases}){
  const hasCustom = customFrom && customTo;
  const isCurrentWeek = (()=>{
    if(!customTo) return false;
    const d = new Date(customTo);
    const now = currentWeekStart();
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate()+6);
    return d>=now && d<=end;
  })();
  const [cooldown, setCooldown] = useState(0);
  useEffect(()=>{
    const tick = ()=>{
      const last = parseInt(localStorage.getItem(LAST_REFRESH_KEY)||'0',10);
      const elapsed = Date.now()-last;
      setCooldown(elapsed < REFRESH_COOLDOWN_MS ? Math.ceil((REFRESH_COOLDOWN_MS-elapsed)/1000) : 0);
    };
    tick();
    const iv = setInterval(tick, 1000);
    return ()=>clearInterval(iv);
  },[]);
  const doRefresh = ()=>{
    localStorage.setItem(LAST_REFRESH_KEY, String(Date.now()));
    setCooldown(REFRESH_COOLDOWN_MS/1000);
    onRefresh();
  };
  const clearCustom = ()=>{ setCustomFrom(''); setCustomTo(''); };
  const mmss = s => { const m=Math.floor(s/60); return m>0?`${m}m ${s%60}s`:`${s}s`; };
  return (
    <div className="flex flex-wrap items-center gap-3">
      <div className={`flex items-center bg-card border border-border rounded-lg p-1 gap-0.5 ${hasCustom?'opacity-40 pointer-events-none':''}`}>
        {TIME_WINDOWS.map(w=>(
          <button key={w.value} onClick={()=>setTimeWindow(w.value)}
            className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${timeWindow===w.value && !hasCustom ? 'text-white shadow-sm' : 'text-muted-foreground hover:text-foreground'}`}
            style={timeWindow===w.value && !hasCustom ? {backgroundColor:'#0047FF'} : {}}>{w.label}</button>
        ))}
      </div>
      <div className="flex items-center gap-2 bg-card border border-border rounded-lg px-3 py-1.5">
        <span className="text-xs text-muted-foreground font-medium">From</span>
        <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} className="text-sm bg-transparent border-none outline-none text-foreground"/>
        <span className="text-xs text-muted-foreground font-medium">To</span>
        <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} className="text-sm bg-transparent border-none outline-none text-foreground"/>
        {hasCustom && <button onClick={clearCustom} className="ml-1 text-muted-foreground hover:text-foreground"><Icon name="X" className="w-3.5 h-3.5"/></button>}
      </div>
      {isCurrentWeek && (
        <div className="flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-700 rounded-lg px-3 py-1.5 text-xs font-medium">
          <Icon name="AlertTriangle" className="w-3.5 h-3.5 shrink-0"/>
          <span>Current week data may be incomplete — sheet updates every Monday</span>
        </div>
      )}
      {includeAllPhases ? (
        <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-700 rounded-lg px-3 py-1.5 text-xs font-medium">
          <span>Showing all phases (incl. Paused, Onboarding)</span>
          <button onClick={()=>setIncludeAllPhases(false)} className="underline text-amber-600 hover:text-amber-800 ml-1">Active only</button>
        </div>
      ) : (
        <div className="flex items-center gap-2 rounded-lg px-3 py-1.5 text-xs font-medium" style={{backgroundColor:'#EEF3FF', border:'1px solid #bfcfff', color:'#0047FF'}}>
          <span>Showing: Active · Retention · Offboarding only</span>
          <button onClick={()=>setIncludeAllPhases(true)} className="underline ml-1 hover:opacity-70 transition-opacity" style={{color:'#0047FF'}}>Include all phases</button>
        </div>
      )}
      <div className="ml-auto flex flex-col items-end gap-0.5">
        <Button variant="outline" size="sm" onClick={doRefresh} disabled={isRefreshing || cooldown>0} className="gap-2" style={{borderColor:'#0047FF', color:'#0047FF'}}>
          <Icon name="RefreshCw" className={`w-3.5 h-3.5 ${isRefreshing?'animate-spin':''}`}/>Refresh data
        </Button>
        {cooldown>0 && <span className="text-[10px] text-muted-foreground">Next refresh in {mmss(cooldown)}</span>}
      </div>
    </div>
  );
}

      )}

  );
}

/* ─── Client Spotlight card ────────────────────────────────── */
function ClientSpotlight({client, filteredFacts, allFacts, onClose}){
  const ref = useRef(null);
  if(!client) return null;
  const rows = filteredFacts.filter(r=>r.client===client);
  const weeks = distinctWeeks(rows);
  const meta = clientMeta(allFacts, client);
  const weekly = weeks.map(w=>{
    const t = w.getTime();
    const ws = rows.filter(r=>r.weekStart.getTime()===t);
    const sent = ws.reduce((s,r)=>s+r.sent,0);
    const replies = ws.reduce((s,r)=>s+r.replies,0);
    return {week: weekLabel(w), Sent: sent, Replies: replies, PRs: ws.reduce((s,r)=>s+r.pos,0), MB: ws.reduce((s,r)=>s+r.meetings,0),
      replyRate: sent>0 ? parseFloat((replies/sent*100).toFixed(1)) : 0};
  });
  const total = rows.reduce((a,r)=>({sent:a.sent+r.sent, replies:a.replies+r.replies, pos:a.pos+r.pos, meetings:a.meetings+r.meetings}), {sent:0,replies:0,pos:0,meetings:0});
  const rr = total.sent>0 ? (total.replies/total.sent*100).toFixed(1) : '0.0';
  const exportPNG = ()=>{
    if(!ref.current) return;
    html2canvas(ref.current, {scale:2, useCORS:true}).then(canvas=>{
      const a = document.createElement('a');
      a.download = `${client}_spotlight.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  };
  const exportCSV = ()=>{
    const lines = [['Week','Sent','Replies','PRs','MB','Reply Rate %']];
    weekly.forEach(w=>{
      const rr = w.Sent>0 ? (w.Replies/w.Sent*100).toFixed(1) : '0.0';
      lines.push([w.week, w.Sent, w.Replies, w.PRs, w.MB, rr]);
    });
    const blob = new Blob([lines.map(l=>l.join(',')).join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.download = `${client}_spotlight.csv`;
    a.href = URL.createObjectURL(blob);
    a.click();
  };
  const mbSeries = weekly.map(w=>({week:w.week, mb:w.MB}));
  const best = mbSeries.reduce((b,w)=> w.mb>=b.mb ? w : b, mbSeries[0]||{week:'—',mb:0});
  const worst = mbSeries.reduce((b,w)=> w.mb<=b.mb ? w : b, mbSeries[0]||{week:'—',mb:0});
  const { ResponsiveContainer, LineChart, XAxis, YAxis, CartesianGrid, Tooltip, Line, Legend } = Recharts;
  return (
    <div ref={ref} className="bg-card border border-border rounded-xl p-5 space-y-5">
      <div className="flex items-start justify-between gap-3">
        <div>
          <div className="flex items-center gap-2 mb-1">
            <span className="text-xs font-semibold uppercase tracking-wider text-primary bg-primary/10 px-2 py-0.5 rounded">Client Spotlight</span>
          </div>
          <h2 className="text-lg font-bold text-foreground">{client}</h2>
          <div className="flex flex-wrap gap-3 mt-1 text-xs text-muted-foreground">
            {meta.am && <span>AM: <span className="font-medium text-foreground">{meta.am}</span></span>}
            {meta.vertical && <span>Vertical: <span className="font-medium text-foreground">{meta.vertical}</span></span>}
            {meta.status && <span>Status: <span className="font-medium text-foreground">{meta.status}</span></span>}
          </div>
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={exportPNG} title="Export PNG" className="text-xs px-2 py-1 rounded-md bg-secondary hover:bg-border text-muted-foreground hover:text-foreground transition-colors">📷 PNG</button>
          <button onClick={exportCSV} title="Export CSV" className="text-xs px-2 py-1 rounded-md bg-secondary hover:bg-border text-muted-foreground hover:text-foreground transition-colors">📊 CSV</button>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-secondary text-muted-foreground hover:text-foreground transition-colors"><Icon name="X" className="w-4 h-4"/></button>
        </div>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {[{label:'MB',value:total.meetings,color:'#7F77DD'},{label:'PRs',value:total.pos,color:'#D4537E'},{label:'Replies',value:total.replies,color:'#378ADD'},{label:'Reply rate',value:`${rr}%`,color:'#1D9E75'}].map(s=>(
          <div key={s.label} className="bg-secondary/40 border border-border rounded-lg p-3 text-center">
            <div className="text-2xl font-extrabold" style={{color:s.color}}>{s.value}</div>
            <div className="text-[10px] text-muted-foreground uppercase tracking-wider mt-0.5">{s.label}</div>
          </div>
        ))}
      </div>
      {weekly.length>0 ? (
        <div className="h-64">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={weekly} margin={{top:5,right:55,left:45,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="hsl(220 15% 90%)" vertical={false}/>
              <XAxis dataKey="week" tick={{fontSize:10,fill:'hsl(220 10% 50%)'}} axisLine={false} tickLine={false}/>
              <YAxis yAxisId="sent" orientation="left" tick={{fontSize:10,fill:'#94a3b8'}} axisLine={false} tickLine={false} allowDecimals={false}
                tickFormatter={v=>v>=1000?`${(v/1000).toFixed(0)}k`:v}
                label={<text value="Emails Sent" angle={-90} position="insideLeft" offset={-30} style={{fontSize:9,fill:'#94a3b8'}}/>}/>
              <YAxis yAxisId="small" orientation="right" tick={{fontSize:10,fill:'hsl(220 10% 50%)'}} axisLine={false} tickLine={false} allowDecimals={false}
                label={<text value="Replies / PRs / MB" angle={90} position="insideRight" offset={-35} style={{fontSize:9,fill:'hsl(220 10% 50%)'}}/>}/>
              <Tooltip contentStyle={{background:'white', border:'1px solid hsl(220 15% 90%)', borderRadius:'8px', fontSize:'11px'}}/>
              <Legend wrapperStyle={{fontSize:'11px'}}/>
              <Line yAxisId="sent" type="monotone" dataKey="Sent" stroke="#94a3b8" strokeWidth={1} strokeDasharray="4 3" dot={false} connectNulls={true}/>
              <Line yAxisId="small" type="monotone" dataKey="Replies" stroke="#378ADD" strokeWidth={2} dot={{r:2}} connectNulls={true}/>
              <Line yAxisId="small" type="monotone" dataKey="PRs" stroke="#D4537E" strokeWidth={2} dot={{r:2}} connectNulls={true}/>
              <Line yAxisId="small" type="monotone" dataKey="MB" stroke="#22c55e" strokeWidth={2.5} dot={{r:3}} connectNulls={true}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      ) : <p className="text-sm text-muted-foreground text-center py-6">No weekly data found for this client.</p>}
      {weekly.length>1 && (
        <div className="flex gap-3">
          <div className="flex-1 bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-center">
            <p className="text-[10px] text-emerald-700 uppercase tracking-wider font-semibold">Best week</p>
            <p className="text-base font-bold text-emerald-800">{best.week}</p>
            <p className="text-xs text-emerald-600">{best.mb} MB</p>
          </div>
          <div className="flex-1 bg-red-50 border border-red-200 rounded-lg p-3 text-center">
            <p className="text-[10px] text-red-700 uppercase tracking-wider font-semibold">Worst week</p>
            <p className="text-base font-bold text-red-800">{worst.week}</p>
            <p className="text-xs text-red-600">{worst.mb} MB</p>
          </div>
        </div>
      )}
      {weekly.length>0 && (
        <div className="overflow-x-auto">
          <p className="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-2">Weekly Breakdown</p>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="text-muted-foreground border-b border-border">
                <th className="text-left py-1.5 pr-3 font-medium">Week</th>
                <th className="text-right py-1.5 pr-3 font-medium">Sent</th>
                <th className="text-right py-1.5 pr-3 font-medium">Replies</th>
                <th className="text-right py-1.5 pr-3 font-medium">Reply Rate %</th>
                <th className="text-right py-1.5 pr-3 font-medium">PRs</th>
                <th className="text-right py-1.5 font-medium">MB</th>
              </tr>
            </thead>
            <tbody>
              {weekly.map(w=>(
                <tr key={w.week} className="border-b border-border/40 hover:bg-secondary/30 transition-colors">
                  <td className="py-1.5 pr-3 font-medium text-foreground">{w.week}</td>
                  <td className="py-1.5 pr-3 text-right text-muted-foreground">{w.Sent.toLocaleString()}</td>
                  <td className="py-1.5 pr-3 text-right text-muted-foreground">{w.Replies}</td>
                  <td className="py-1.5 pr-3 text-right" style={{color: w.replyRate>5 ? '#16a34a' : 'hsl(var(--muted-foreground))'}}>{w.replyRate}%</td>
                  <td className="py-1.5 pr-3 text-right text-muted-foreground">{w.PRs}</td>
                  <td className="py-1.5 text-right font-bold" style={{color: w.MB>0 ? '#7F77DD' : 'hsl(var(--muted-foreground))'}}>{w.MB}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ─── AM weekly metric chart ───────────────────────────────── */
const METRIC_TABS = [{label:'MB',value:'meetings'},{label:'PRs',value:'pos'},{label:'Total replies',value:'replies'},{label:'Reply rate %',value:'replyRate'},{label:'Meeting rate %',value:'meetingRate'}];
const METRIC_TITLES = {meetings:'MB (Meetings Booked)',pos:'PRs (Positive Responses)',replies:'Total Replies',replyRate:'Reply Rate %',meetingRate:'Meeting Rate %'};
const RATE_METRICS = new Set(['replyRate','meetingRate']);
function AMWeeklyChart({filteredFacts, allFacts, metric, setMetric, onAMClick}){
  const [source, setSource] = useState('All');
  const sources = useMemo(()=>{
    const pool = allFacts && allFacts.length ? allFacts : filteredFacts;
    const set = new Set(pool.map(r=>(r.leadSource||'').trim()).filter(Boolean));
    return ['All', ...Array.from(set).sort()];
  }, [allFacts, filteredFacts]);
  const rows = useMemo(()=> source==='All' ? filteredFacts : filteredFacts.filter(r=>(r.leadSource||'').trim()===source), [filteredFacts, source]);
  const weeks = distinctWeeks(filteredFacts);
  const isRate = RATE_METRICS.has(metric);
  const data = weeks.map(w=>{
    const t = w.getTime();
    const point = {week: weekLabel(w), weekDate: w};
    AMS.forEach(am=>{
      const ws = rows.filter(r=>r.weekStart.getTime()===t && r.am===am);
      if(metric==='replyRate'){
        const sent = ws.reduce((s,r)=>s+r.sent,0), rep = ws.reduce((s,r)=>s+r.replies,0);
        point[am] = sent>0 ? parseFloat((rep/sent*100).toFixed(2)) : 0;
      } else if(metric==='meetingRate'){
        const sent = ws.reduce((s,r)=>s+r.sent,0), mb = ws.reduce((s,r)=>s+r.meetings,0);
        point[am] = sent>0 ? parseFloat((mb/sent*100).toFixed(2)) : 0;
      } else {
        point[am] = ws.reduce((s,r)=>s+r[metric],0);
      }
    });
    return point;
  });
  const { ResponsiveContainer, LineChart, XAxis, YAxis, CartesianGrid, Tooltip, Line } = Recharts;
  return (
    <div className="bg-card border border-border rounded-xl overflow-hidden">
      <div className="flex flex-wrap items-center justify-between gap-3 px-5 pt-4 pb-3 border-b border-border bg-secondary/20">
        <div className="flex items-center gap-1 flex-wrap">
          {METRIC_TABS.map(m=>(
            <button key={m.value} onClick={()=>setMetric(m.value)}
              className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${metric===m.value?'bg-foreground text-card shadow-sm':'text-muted-foreground hover:text-foreground'}`}>{m.label}</button>
          ))}
        </div>
        <div className="flex flex-wrap items-center gap-3">
          {sources.length>0 && (
            <div className="flex items-center gap-1.5 flex-wrap">
              <span className="text-[10px] text-muted-foreground font-medium uppercase tracking-wider">Lead Source:</span>
              {sources.map(s=>(
                <button key={s} onClick={()=>setSource(s)}
                  className={`px-2 py-0.5 rounded text-[11px] font-medium transition-all border ${source===s?'bg-foreground text-card border-foreground':'text-muted-foreground border-border hover:border-foreground hover:text-foreground'}`}>{s}</button>
              ))}
            </div>
          )}
          {AMS.map(am=>(
            <button key={am} onClick={onAMClick ? ()=>onAMClick(am) : undefined} className="flex items-center gap-1.5 hover:opacity-70 transition-opacity">
              <div className="w-2.5 h-2.5 rounded-full" style={{backgroundColor:AM_COLORS[am]}}></div>
              <span className="text-xs text-muted-foreground hover:text-foreground">{am}</span>
            </button>
          ))}
        </div>
      </div>
      <div className="px-5 pt-4 pb-5">
        <h2 className="text-sm font-semibold text-foreground mb-4">{METRIC_TITLES[metric]} by AM — Weekly Trend</h2>
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={data} margin={{top:5,right:10,left:0,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="hsl(220 15% 90%)" vertical={false}/>
              <XAxis dataKey="week" tick={{fontSize:11,fill:'hsl(220 10% 50%)'}} axisLine={{stroke:'hsl(220 15% 90%)'}} tickLine={false}/>
              <YAxis tick={{fontSize:11,fill:'hsl(220 10% 50%)'}} axisLine={false} tickLine={false} allowDecimals={isRate} tickFormatter={isRate ? v=>`${v}%` : undefined}/>
              <Tooltip contentStyle={{background:'white', border:'1px solid hsl(220 15% 90%)', borderRadius:'12px', fontSize:'12px', boxShadow:'0 4px 12px rgba(0,0,0,0.08)'}}
                formatter={(v,name)=>[isRate?`${v}%`:v, name]}/>
              {AMS.map(am=>(
                <Line key={am} type="monotone" dataKey={am} stroke={AM_COLORS[am]} strokeWidth={2} dot={{r:3, fill:AM_COLORS[am], strokeWidth:0}} activeDot={{r:5, strokeWidth:0}} connectNulls={true}/>
              ))}
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

/* ─── Vertical Breakdown ───────────────────────────────────── */
const VERTICAL_METRICS = {meetings:{label:'MB',color:'#7F77DD'},replies:{label:'Replies',color:'#378ADD'},replyRate:{label:'Reply Rate %',color:'#1D9E75'},pos:{label:'PRs',color:'#D4537E'}};
function VerticalGroupTable({facts, groupName}){
  const per = {};
  facts.forEach(r=>{
    const v = (r.vertical||'').trim();
    if(mapVertical(v) !== groupName) return;
    if(!per[r.client]) per[r.client] = {client:r.client, am:r.am, category:v, leadSource:r.leadSource||'', sent:0, replies:0, pos:0, meetings:0};
    const c = per[r.client];
    c.sent+=r.sent; c.replies+=r.replies; c.pos+=r.pos; c.meetings+=r.meetings;
  });
  const rows = Object.values(per).sort((a,b)=>b.meetings-a.meetings);
  if(!rows.length) return <p className="text-xs text-muted-foreground py-2">No client data.</p>;
  return (
    <div className="overflow-x-auto mt-2">
      <table className="w-full text-[11px]">
        <thead>
          <tr className="text-muted-foreground border-b border-border">
            <th className="text-left py-1.5 pr-3 font-medium">Client</th>
            <th className="text-left py-1.5 pr-3 font-medium">AM</th>
            <th className="text-left py-1.5 pr-3 font-medium">Category</th>
            <th className="text-left py-1.5 pr-3 font-medium">Lead Source</th>
            <th className="text-right py-1.5 pr-3 font-medium">Sent</th>
            <th className="text-right py-1.5 pr-3 font-medium">Replies</th>
            <th className="text-right py-1.5 pr-3 font-medium">PRs</th>
            <th className="text-right py-1.5 pr-3 font-medium">MB</th>
            <th className="text-right py-1.5 pr-3 font-medium">Reply %</th>
            <th className="text-right py-1.5 pr-3 font-medium">MB Rate %</th>
            <th className="text-right py-1.5 pr-3 font-medium">PRs→MB %</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(c=>(
            <tr key={c.client} className="border-b border-border/50 hover:bg-secondary/40 transition-colors">
              <td className="py-1.5 pr-3 font-medium text-foreground">{c.client}</td>
              <td className="py-1.5 pr-3"><span className="font-medium" style={{color: AM_COLORS[c.am]||'hsl(var(--muted-foreground))'}}>{c.am}</span></td>
              <td className="py-1.5 pr-3 text-muted-foreground">{c.category||'—'}</td>
              <td className="py-1.5 pr-3 text-muted-foreground">{c.leadSource||'—'}</td>
              <td className="py-1.5 pr-3 text-right text-muted-foreground">{c.sent.toLocaleString()}</td>
              <td className="py-1.5 pr-3 text-right text-muted-foreground">{c.replies}</td>
              <td className="py-1.5 pr-3 text-right text-muted-foreground">{c.pos}</td>
              <td className="py-1.5 pr-3 text-right font-bold text-foreground">{c.meetings}</td>
              <td className="py-1.5 pr-3 text-right" style={{color: c.sent>0 && c.replies/c.sent*100>5 ? '#16a34a' : 'hsl(var(--muted-foreground))'}}>{c.sent>0 ? (c.replies/c.sent*100).toFixed(1)+'%' : '—'}</td>
              <td className="py-1.5 pr-3 text-right text-muted-foreground">{c.sent>0 ? (c.meetings/c.sent*100).toFixed(3)+'%' : '—'}</td>
              <td className="py-1.5 text-right text-muted-foreground">{c.pos>0 ? (c.meetings/c.pos*100).toFixed(1)+'%' : '—'}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
function VerticalGroupPanel({group, filteredFacts, onClose}){
  return (
    <div className="bg-secondary/30 border border-border rounded-lg p-4 space-y-3">
      <div className="flex items-center justify-between gap-2">
        <div>
          <p className="text-xs font-semibold text-foreground">{group.vertical}</p>
          <p className="text-[10px] text-muted-foreground">{group.clientCount} client{group.clientCount!==1?'s':''}</p>

        <button onClick={onClose} className="text-muted-foreground hover:text-foreground transition-colors p-1 rounded"><Icon name="X" className="w-4 h-4"/></button>
      </div>
      <VerticalGroupTable facts={filteredFacts} groupName={group.vertical}/>
    </div>
  );
}
function VerticalBreakdown({filteredFacts, prevFacts, periodLabel, highlightVertical}){
  const [metric, setMetric] = useState('meetings');
  const [openGroup, setOpenGroup] = useState(null);
  const current = useMemo(()=>verticalRollup(filteredFacts), [filteredFacts]);
  const previous = useMemo(()=>verticalRollup(prevFacts||[]), [prevFacts]);
  const prevMap = useMemo(()=>{ const m={}; previous.forEach(g=>{m[g.vertical]=g;}); return m; }, [previous]);
  if(!current.length) return (
    <div className="bg-card border border-border rounded-xl p-5">
      <h2 className="text-sm font-semibold text-foreground mb-3">Vertical Breakdown</h2>
      <p className="text-sm text-muted-foreground py-8 text-center">No vertical data found in the current period.</p>
    </div>
  );
  const key = metric==='replyRate' ? 'replyRate' : metric;
  const rows = [...current].filter(g=>g[key]>0).sort((a,b)=>b[key]-a[key]);
  const top = rows[0] || null;
  const max = Math.max(...rows.map(g=> metric==='replyRate' ? g.replyRate : g[metric]), 1);
  const color = VERTICAL_METRICS[metric].color;
  const open = openGroup ? current.find(g=>g.vertical===openGroup) : null;
  return (
    <div className="bg-card border border-border rounded-xl p-5 space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2"><h2 className="text-sm font-semibold text-foreground">Vertical Breakdown</h2></div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="flex items-center bg-secondary rounded-lg p-1 gap-0.5">
            {Object.entries(VERTICAL_METRICS).map(([k, v])=>(
              <button key={k} onClick={()=>setMetric(k)}
                className={`px-3 py-1 rounded-md text-xs font-medium transition-all ${metric===k?'bg-card shadow-sm text-foreground':'text-muted-foreground hover:text-foreground'}`}>{v.label}</button>
            ))}
          </div>
        </div>
      </div>
      {top && (
        <div className="flex items-center gap-4 bg-secondary/40 border border-border rounded-lg px-4 py-3">
          <div className="text-lg">🏆</div>
          <div className="flex-1 min-w-0">
            <p className="text-[10px] text-muted-foreground uppercase tracking-wider font-medium">Top Vertical{periodLabel?` — ${periodLabel}`:''}</p>
            <p className="text-sm font-bold text-foreground truncate">{top.vertical}</p>
          </div>
          <div className="text-right shrink-0">
            <p className="text-lg font-extrabold" style={{color}}>{metric==='replyRate' ? `${top.replyRate}%` : top[metric]}</p>
            <p className="text-[10px] text-muted-foreground">{top.clientCount} client{top.clientCount!==1?'s':''}</p>
          </div>
        </div>
      )}
      <div className="space-y-2">
        {rows.map((g, i)=>{
          const val = g[key];
          const widthPct = max>0 ? val/max*100 : 0;
          const display = metric==='replyRate' ? `${val}%` : val;
          const isHi = highlightVertical && g.vertical===highlightVertical;
          const isOpen = openGroup===g.vertical;
          const prev = prevMap[g.vertical];
          const prevVal = prev ? (metric==='replyRate' ? prev.replyRate : prev[metric]) : null;
          return (
            <button key={g.vertical} onClick={()=>setOpenGroup(isOpen?null:g.vertical)}
              className={`w-full flex items-center gap-2 rounded-md transition-all px-1 py-0.5 text-left group ${isOpen?'bg-primary/10 ring-1 ring-primary/30':isHi?'bg-yellow-50 ring-1 ring-yellow-300':'hover:bg-secondary/60'}`}>
              <div className={`text-[10px] text-right shrink-0 truncate ${isOpen?'text-primary font-semibold':isHi?'text-yellow-700 font-semibold':'text-muted-foreground group-hover:text-foreground'}`}
                style={{width:160}} title={g.vertical}>{g.vertical.length>24 ? g.vertical.slice(0,24)+'…' : g.vertical}</div>
              <div className="flex-1 h-5 bg-secondary rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-300" style={{width:`${widthPct}%`, backgroundColor: isOpen?'hsl(221 83% 53%)':color, opacity: isOpen?1:1-i/rows.length*0.45, minWidth: val>0?4:0}}></div>
              </div>
              <div className="text-[10px] font-semibold shrink-0 text-right" style={{width:36, color: isOpen?'hsl(221 83% 53%)':color}}>{display}</div>
              {prevVal!==null ? (val>prevVal ? <span className="text-[11px] text-green-500 w-4 shrink-0">↑</span> : val<prevVal ? <span className="text-[11px] text-red-400 w-4 shrink-0">↓</span> : <span className="text-[10px] text-gray-300 w-4 shrink-0">—</span>) : <span className="text-[10px] text-gray-300 w-4 shrink-0">—</span>}
            </button>
          );
        })}
      </div>
      {open && <VerticalGroupPanel group={open} filteredFacts={filteredFacts} onClose={()=>setOpenGroup(null)}/>}
    </div>
  );
}

/* ─── Ask the Dashboard (AI via user-provided OpenAI key) ──── */
function getAIKey(){ try { return localStorage.getItem(AI_KEY_STORAGE) || ''; } catch { return ''; } }
async function askLLM(context, question){
  const key = getAIKey();
  if(!key) throw new Error('NO_KEY');
  const prompt = `You are a sales performance analyst. Here is the current filtered dashboard data:\n\n${context}\n\nManager's question: "${question}"\n\nAnswer in 3-5 plain-English sentences. Reference specific numbers from the data. Be direct and actionable. Do not give generic advice.`;
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
    body: JSON.stringify({model:'gpt-4o-mini', messages:[{role:'user', content:prompt}], temperature:0.2}),
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`OpenAI error ${res.status}: ${t.slice(0,140)}`);
  }
  const j = await res.json();
  const text = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  return typeof text==='string' ? text : JSON.stringify(j);
}
function AskDashboard({filteredFacts}){
  const [q, setQ] = useState('');

    'Which clients are at risk of churning?',
    'Who improved the most this period?',
    'Which AM is most efficient overall?',
  ];
  const run = async (question)=>{
    const text = (question || q).trim();
    if(!text || busy) return;
    setBusy(true); setAnswer('');
    try{
      const res = await askLLM(buildAnalystContext(filteredFacts), text);
      setAnswer(res);
    }catch(err){
      setAnswer(err.message==='NO_KEY'
        ? 'AI answering needs an OpenAI API key. Click the key icon (top-right of this card) to add one — it stays in your browser only.'
        : `Could not answer: ${err.message}`);

      </div>
      <p className="text-xs text-muted-foreground -mt-2">Ask a plain-English question about your team's performance. The AI will answer using actual numbers from the current filtered data.</p>
      {keyOpen && (
        <div className="bg-secondary/40 border border-border rounded-lg p-3 space-y-2">

        <Button onClick={()=>run()} disabled={busy || !q.trim()} className="shrink-0">
          {busy ? <Icon name="Loader" className="w-3.5 h-3.5 animate-spin"/> : <Icon name="Sparkles" className="w-3.5 h-3.5"/>}Ask
        </Button>
      </div>
      {!busy && !answer && (
        <div className="flex flex-wrap gap-2">
          {suggestions.map(s=>(
            <button key={s} onClick={()=>suggestionClick(s)}

      {answer && (

  );

/* ─── AM Performance (Team Overview + Client Detail) ───────── */
function TrendPill({current, prev}){
  if(prev===0 && current===0) return <span className="text-gray-400 text-[10px]">—</span>;
  const d = current - prev;
  return d>0 ? <span className="text-green-600 text-[10px] font-semibold">↑ +{d}</span>
    : d<0 ? <span className="text-red-500 text-[10px] font-semibold">↓ {d}</span>
    : <span className="text-gray-400 text-[10px]">—</span>;
}
function AMComparison({filteredFacts, allFacts, embedded}){
  const [sortKey, setSortKey] = useState('mb');
  const [sortDir, setSortDir] = useState(-1);
  const {rows, prevMap} = useMemo(()=>{
    const weeks = distinctWeeks(filteredFacts).sort((a,b)=>a-b);
    const n = weeks.length;
    const vertTotals = {};
    allFacts.forEach(r=>{
      const v = mapVertical((r.vertical||'').trim());
      if(!v) return;
      if(!vertTotals[v]) vertTotals[v]={sent:0,meetings:0};
      vertTotals[v].sent += r.sent; vertTotals[v].meetings += r.meetings;
    });
    const icpSet = new Set(Object.entries(vertTotals).filter(([,v])=>v.sent>0 && v.meetings/v.sent*100 >= 0.02).map(([v])=>v));
    const firstWeek = weeks[0] ? weeks[0].getTime() : 0;
    const beforeRows = allFacts.filter(r=>r.weekStart.getTime() < firstWeek);
    const beforeWeeks = distinctWeeks(beforeRows).sort((a,b)=>a-b).slice(-n);
    const beforeSet = new Set(beforeWeeks.map(w=>w.getTime()));
    const prevMap = {};
    allFacts.filter(r=>beforeSet.has(r.weekStart.getTime())).forEach(r=>{
      if(!prevMap[r.am]) prevMap[r.am]={sent:0,replies:0,pos:0,meetings:0,clients:new Set()};
      const p = prevMap[r.am];
      p.sent+=r.sent; p.replies+=r.replies; p.pos+=r.pos; p.meetings+=r.meetings; p.clients.add(r.client);
    });
    const agg = {};
    filteredFacts.forEach(r=>{
      const v = mapVertical((r.vertical||'').trim());
      const isICP = icpSet.has(v);
      if(!agg[r.am]) agg[r.am]={sent:0,replies:0,pos:0,meetings:0,clients:new Set(),icpSent:0,icpReplies:0,nonIcpSent:0,nonIcpReplies:0};
      const a = agg[r.am];
      a.sent+=r.sent; a.replies+=r.replies; a.pos+=r.pos; a.meetings+=r.meetings; a.clients.add(r.client);
      if(isICP){ a.icpSent+=r.sent; a.icpReplies+=r.replies; } else { a.nonIcpSent+=r.sent; a.nonIcpReplies+=r.replies; }
    });
    return {
      rows: AMS.map(am=>{
        const a = agg[am] || {sent:0,replies:0,pos:0,meetings:0,clients:new Set(),icpSent:0,icpReplies:0,nonIcpSent:0,nonIcpReplies:0};
        return {
          am, clients: a.clients.size, sent: a.sent,
          replyRate: a.sent>0 ? parseFloat((a.replies/a.sent*100).toFixed(2)) : 0,
          replyRateICP: a.icpSent>0 ? (a.icpReplies/a.icpSent*100).toFixed(2) : null,
          replyRateNonICP: a.nonIcpSent>0 ? (a.nonIcpReplies/a.nonIcpSent*100).toFixed(2) : null,
          repliesToPR: a.replies>0 ? parseFloat((a.pos/a.replies*100).toFixed(1)) : null,
          prToMB: a.pos>0 ? parseFloat((a.meetings/a.pos*100).toFixed(1)) : null,
          pos: a.pos, mb: a.meetings,
        };
      }),
      prevMap,
    };
  }, [filteredFacts, allFacts]);
  const sorted = [...rows].sort((a,b)=> sortDir*(b[sortKey]-a[sortKey]));
  const sortHdr = (col, label)=>(
    <th className="text-right py-2 pr-3 font-medium cursor-pointer select-none hover:text-foreground transition-colors" onClick={()=>{ sortKey===col ? setSortDir(d=>-d) : (setSortKey(col), setSortDir(-1)); }}>
      {label} {sortKey===col ? (sortDir===-1?'↓':'↑') : ''}
    </th>
  );
  const table = (
    <div className="overflow-x-auto">
      <table className="w-full text-xs">
        <thead>
          <tr className="text-muted-foreground border-b border-border">
            <th className="text-left py-2 pr-3 font-medium">AM</th>
            {sortHdr('clients','Clients')}
            {sortHdr('sent','Sent')}
            {sortHdr('replyRate','Reply %')}
            <th className="text-right py-2 pr-3 font-medium text-muted-foreground whitespace-nowrap">ICP / Non-ICP</th>
            {sortHdr('repliesToPR','Reply→PR %')}
            {sortHdr('prToMB','PR→MB %')}
            {sortHdr('pos','PRs')}
            {sortHdr('mb','MB')}
            <th className="text-right py-2 font-medium">vs Prev</th>
          </tr>
        </thead>
        <tbody>
          {sorted.map(r=>{
            const prev = prevMap[r.am] || {};
            return (
              <tr key={r.am} className="border-b border-border/40 hover:bg-secondary/30">
                <td className="py-2 pr-3 font-semibold" style={{color:AM_COLORS[r.am]}}>{r.am}</td>
                <td className="py-2 pr-3 text-right text-muted-foreground">{r.clients}</td>
                <td className="py-2 pr-3 text-right text-muted-foreground">{r.sent.toLocaleString()}</td>
                <td className="py-2 pr-3 text-right">{r.replyRate}%</td>
                <td className="py-2 pr-3 text-right text-[10px] text-muted-foreground whitespace-nowrap">
                  {r.replyRateICP!==null || r.replyRateNonICP!==null ? (
                    <span><span className="text-green-600 font-medium">{r.replyRateICP!==null?`${r.replyRateICP}%`:'—'}</span> / <span className="text-red-500">{r.replyRateNonICP!==null?`${r.replyRateNonICP}%`:'—'}</span></span>
                  ) : '—'}
                </td>
                <td className="py-2 pr-3 text-right text-muted-foreground">{r.repliesToPR!==null?`${r.repliesToPR}%`:<span className="text-muted-foreground/50">—</span>}</td>
                <td className="py-2 pr-3 text-right text-muted-foreground">{r.prToMB!==null?`${r.prToMB}%`:<span className="text-muted-foreground/50">—</span>}</td>
                <td className="py-2 pr-3 text-right text-muted-foreground">{r.pos}</td>
                <td className="py-2 pr-3 text-right font-bold text-foreground">{r.mb}</td>
                <td className="py-2 text-right"><TrendPill current={r.mb} prev={prev.meetings||0}/></td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <p className="text-[10px] text-muted-foreground mt-2">ICP = verticals with team-wide MB rate ≥ 0.02% · Non-ICP = below threshold</p>
    </div>
  );
  return embedded ? (
    <div className="space-y-2">
      <p className="text-xs text-muted-foreground">Click column headers to sort. vs = change vs previous equivalent period.</p>
      {table}
    </div>
  ) : (
    <div className="bg-card border border-border rounded-xl p-5 space-y-4">
      <div>
        <h2 className="text-sm font-semibold text-foreground">AM Comparison</h2>
        <p className="text-xs text-muted-foreground mt-0.5">Click column headers to sort. vs = change vs previous equivalent period.</p>
      </div>
      {table}
    </div>
  );
}

      const recent3 = recentWeeks.slice(0,3);
      if(recent3.length>=3 && recent3.every(w=> !c.weekData[w.getTime()] || c.weekData[w.getTime()].meetings===0)){
        const vg = mapVertical((c.vertical||'').trim());
        const vRate = vg ? (vertRates[vg] ?? null) : null;
        const isLow = vRate!==null && vRate < RISK_VERTICAL_THRESHOLD;
        const weeks = activeWeeksSince(c.firstWeek);
        const age = ageBand(weeks);
        const since = c.firstWeek ? c.firstWeek.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '?';
        const item = {...c, vertGroup:vg, vMBRate:vRate, isLowVertical:isLow, activeWeeks:weeks, age, firstWeekLabel:since};
        (isLow || vRate===null) ? noMBHard.push(item) : noMBShould.push(item);
      }
      const totalSent = Object.values(c.weekData).reduce((s,w)=>s+w.sent,0);
      const totalReplies = Object.values(c.weekData).reduce((s,w)=>s+w.replies,0);
      const nWeeks = Object.keys(c.weekData).length || 1;
      const avgSent = totalSent/nWeeks;
      const replyRate = totalSent>0 ? totalReplies/totalSent : 0;
      if(avgSent>=1000 && replyRate<0.001) highVol.push({...c, issue:`Avg ${Math.round(avgSent).toLocaleString()} emails/wk, reply rate ${(replyRate*100).toFixed(3)}%`});
      const totalPos = Object.values(c.weekData).reduce((s,w)=>s+w.pos,0);
      const totalMB = Object.values(c.weekData).reduce((s,w)=>s+w.meetings,0);
      if(totalPos>=3 && totalMB===0) prsStuck.push({...c, issue:`${totalPos} PRs but 0 MB in period`});
    });
    noMBHard.sort((a,b)=>b.activeWeeks-a.activeWeeks);
    noMBShould.sort((a,b)=>b.activeWeeks-a.activeWeeks);
    return {noMBHard, noMBShould, highVol, prsStuck};
  }, [filteredFacts, allFacts]);
  const cats = [
    {key:'shouldConvert', count:risk.noMBShouldConvert !== undefined ? 0 : risk.noMBShould.length, label:'should be converting'},
    {key:'hardVertical', count:risk.noMBHard.length, label:'low-performing vertical'},
    {key:'highVolume', count:risk.highVol.length, label:'high volume no results'},
    {key:'prs', count:risk.prsStuck.length, label:'PRs not converting'},
  ].filter(c=>c.count>0);
  const total = cats.reduce((s,c)=>s+c.count, 0);
  const summary = cats.length>0 ? `${cats.length} risk categor${cats.length!==1?'ies':'y'} · ${cats.map(c=>`${c.count} ${c.label}`).join(' · ')}` : 'No risk alerts';
  return (
    <div className="bg-card border border-border rounded-xl p-5">
      <button onClick={()=>setOpen(o=>!o)} className="w-full flex items-start gap-3 text-left group">
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <h2 className="text-sm font-semibold text-foreground">Client Risk Alerts</h2>
            {total>0 && <span className="text-[10px] font-semibold bg-red-100 text-red-600 px-2 py-0.5 rounded-full">{total}</span>}
            <RiskInfoTooltip/>
          </div>
          {!open && <p className="text-[11px] text-muted-foreground mt-0.5 truncate">{summary}</p>}
        </div>
        {open ? <Icon name="ChevronUp" className="w-4 h-4 text-muted-foreground mt-0.5 shrink-0"/> : <Icon name="ChevronDown" className="w-4 h-4 text-muted-foreground mt-0.5 shrink-0"/>}
      </button>
      {open && (
        <div className="mt-4 space-y-2">
          {total===0 && <p className="text-sm text-muted-foreground py-4 text-center">No risk alerts in the current period. 🎉</p>}
          <RiskCategory id="shouldConvert" emoji="🔴" title="No MB: Should be converting" count={risk.noMBShould.length}
            subtitle="Classified as should-be-converting because other clients in this same vertical ARE booking meetings in the selected period, suggesting the vertical responds to cold email but this specific client/campaign needs attention."
            bgClass="bg-red-50" borderClass="border-red-100" openCategories={openCategories} setOpenCategories={setOpenCategories}>
            {risk.noMBShould.map(c=><RiskItem key={c.client} item={c}/>)}
          </RiskCategory>
          <RiskCategory id="hardVertical" emoji="🔴" title="No MB: Low-performing vertical" count={risk.noMBHard.length}
            subtitle="Classified as low-performing because the vertical's team-wide MB rate across all clients and all time is below 0.02%. This means cold email historically struggles in this industry — not necessarily an AM execution problem."
            bgClass="bg-orange-50" borderClass="border-orange-100" openCategories={openCategories} setOpenCategories={setOpenCategories}>
            {risk.noMBHard.map(c=><RiskItem key={c.client} item={c}/>)}
          </RiskCategory>
          <RiskCategory id="highVolume" emoji="🟡" title="High volume, no results" count={risk.highVol.length}
            bgClass="bg-amber-50" borderClass="border-amber-100" openCategories={openCategories} setOpenCategories={setOpenCategories}>
            {risk.highVol.map(c=><SimpleRiskItem key={c.client} item={c}/>)}
          </RiskCategory>
          <RiskCategory id="prs" emoji="🟡" title="PRs not converting" count={risk.prsStuck.length}
            bgClass="bg-amber-50" borderClass="border-amber-100" openCategories={openCategories} setOpenCategories={setOpenCategories}>
            {risk.prsStuck.map(c=><SimpleRiskItem key={c.client} item={c}/>)}
          </RiskCategory>
        </div>
      )}
    </div>
  );
}

/* ─── Reply Rate Buckets ───────────────────────────────────── */
const REPLY_BANDS = [
  {id:'high', emoji:'🟢', label:'High performers', subtitle:'Reply rate > 1%', min:1, max:Infinity, bg:'bg-green-50', border:'border-green-100'},
  {id:'growth', emoji:'🟡', label:'Growth opportunity', subtitle:'Reply rate 0.5%–0.99%', min:0.5, max:1, bg:'bg-amber-50', border:'border-amber-100', highlight:true},
  {id:'under', emoji:'🔴', label:'Underperforming', subtitle:'Reply rate < 0.5%', min:0, max:0.5, bg:'bg-red-50', border:'border-red-100'},
];
function ReplyRateBuckets({filteredFacts}){
  const [open, setOpen] = useState(true);
  const [expanded, setExpanded] = useState(new Set(['growth']));
  const clients = useMemo(()=>{
    const minSent = Math.max(1, distinctWeeks(filteredFacts).length) * 10;
    const per = {};
    filteredFacts.forEach(r=>{
      if(!per[r.client]) per[r.client] = {client:r.client, am:r.am, vertical: mapVertical((r.vertical||'').trim()), sent:0, replies:0, meetings:0};
      per[r.client].sent += r.sent; per[r.client].replies += r.replies; per[r.client].meetings += r.meetings;
    });
    return Object.values(per).filter(c=>c.sent>=minSent)
      .map(c=>({...c, replyRate: c.sent>0 ? c.replies/c.sent*100 : 0}))
      .sort((a,b)=>b.replyRate-a.replyRate);
  }, [filteredFacts]);
  const bands = REPLY_BANDS.map(b=>({...b, items: clients.filter(c=>c.replyRate>=b.min && c.replyRate<b.max)}));
  const toggleBand = id => setExpanded(prev=>{
    const s = new Set(prev);
    s.has(id) ? s.delete(id) : s.add(id);
    return s;
  });
  const summary = bands.map(b=>`${b.items.length} ${b.id==='high'?'high':b.id==='growth'?'growth':'underperforming'}`).join(' · ');
  return (
    <div className="bg-card border border-border rounded-xl p-5">
      <button onClick={()=>setOpen(o=>!o)} className="w-full flex items-start gap-3 text-left">
        <div className="flex-1 min-w-0">
          <h2 className="text-sm font-semibold text-foreground">Reply Rate Buckets</h2>
          {!open && <p className="text-[11px] text-muted-foreground mt-0.5">{summary}</p>}
        </div>
        {open ? <Icon name="ChevronUp" className="w-4 h-4 text-muted-foreground mt-0.5 shrink-0"/> : <Icon name="ChevronDown" className="w-4 h-4 text-muted-foreground mt-0.5 shrink-0"/>}
      </button>
      {open && (
        <div className="mt-4 space-y-2">
          {bands.map(b=>{
            const isOpen = expanded.has(b.id);
            return (
              <div key={b.id}>
                <button onClick={()=>toggleBand(b.id)}
                  className={`w-full flex items-center gap-2 py-1.5 px-1 rounded-md hover:bg-secondary/40 transition-colors text-left ${b.highlight?'ring-1 ring-amber-300 bg-amber-50/50 rounded-md':''}`}>
                  <span className="text-base">{b.emoji}</span>
                  <span className="text-xs font-semibold text-foreground flex-1">{b.label} ({b.items.length})</span>
                  {b.highlight && <span className="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-medium">Priority</span>}
                  {isOpen ? <Icon name="ChevronUp" className="w-3.5 h-3.5 text-muted-foreground"/> : <Icon name="ChevronDown" className="w-3.5 h-3.5 text-muted-foreground"/>}
                </button>
                {isOpen && (
                  <div className={`mt-1 ${b.bg} ${b.border} border rounded-lg px-3 py-2`}>
                    {b.highlight && <p className="text-[10px] text-amber-700 font-medium mb-2 py-1 px-2 bg-amber-100 rounded">💡 These accounts are closest to 1% — small improvements here have the highest ROI.</p>}
                    {b.items.length===0 ? (
                      <p className="text-xs text-muted-foreground py-2 text-center">No clients in this range.</p>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-[11px]">
                          <thead>
                            <tr className="text-muted-foreground border-b border-border/50">
                              <th className="text-left py-1.5 pr-3 font-medium">Client</th>
                              <th className="text-left py-1.5 pr-3 font-medium">AM</th>
                              <th className="text-left py-1.5 pr-3 font-medium">Vertical</th>
                              <th className="text-right py-1.5 pr-3 font-medium">Sent</th>
                              <th className="text-right py-1.5 pr-3 font-medium">Reply Rate %</th>
                              <th className="text-right py-1.5 font-medium">MB</th>
                            </tr>
                          </thead>
                          <tbody>
                            {b.items.map(c=>(
                              <tr key={c.client} className="border-b border-border/30 last:border-0">
                                <td className="py-1.5 pr-3 font-medium text-foreground">{c.client}</td>
                                <td className="py-1.5 pr-3 font-semibold" style={{color: AM_COLORS[c.am]||'#888'}}>{c.am}</td>
                                <td className="py-1.5 pr-3 text-muted-foreground truncate max-w-[120px]">{c.vertical||'—'}</td>
                                <td className="py-1.5 pr-3 text-right text-muted-foreground">{c.sent.toLocaleString()}</td>
                                <td className={`py-1.5 pr-3 text-right font-semibold ${b.id==='high'?'text-green-700':b.id==='growth'?'text-amber-700':'text-red-600'}`}>{c.replyRate.toFixed(2)}%</td>
                                <td className="py-1.5 text-right font-bold text-foreground">{c.meetings}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─── Monthly Rollup ───────────────────────────────────────── */
function MonthlyRollup({filteredFacts}){
  const months = useMemo(()=>{
    const per = {};
    filteredFacts.forEach(r=>{
      const k = monthKey(r.weekStart);
      if(!per[k]) per[k] = {key:k, sent:0, replies:0, pos:0, meetings:0, verticals:{}};
      const m = per[k];
      m.sent+=r.sent; m.replies+=r.replies; m.pos+=r.pos; m.meetings+=r.meetings;
      const v = r.vertical || 'Unknown';
      if(!m.verticals[v]) m.verticals[v] = {replies:0, sent:0, meetings:0};
      m.verticals[v].replies+=r.replies; m.verticals[v].sent+=r.sent; m.verticals[v].meetings+=r.meetings;
    });
    return Object.values(per).sort((a,b)=>a.key.localeCompare(b.key)).map(m=>{
      const entries = Object.entries(m.verticals).map(([name,v])=>({name, meetings:v.meetings, replyRate: v.sent>0 ? v.replies/v.sent : 0}));
      const byMeetings = [...entries].sort((a,b)=>b.meetings-a.meetings);
      const byRate = [...entries].sort((a,b)=>b.replyRate-a.replyRate);
      const top = (byMeetings[0] && byMeetings[0].meetings>0) ? byMeetings[0] : byRate[0];
      const reason = (byMeetings[0] && byMeetings[0].meetings>0) ? `${byMeetings[0].meetings} MB` : (byRate[0] ? `${(byRate[0].replyRate*100).toFixed(1)}% reply rate` : '');
      return {...m, topVertical: (top && top.name) || '—', topReason: reason, replyRate: m.sent>0 ? (m.replies/m.sent*100).toFixed(2) : null};
    });
  }, [filteredFacts]);
  if(!months.length) return null;
  return (
    <div className="bg-card border border-border rounded-xl p-5 space-y-4">
      <div>
        <h2 className="text-sm font-semibold text-foreground">Monthly Rollup</h2>
        <p className="text-xs text-muted-foreground mt-0.5">Key metrics grouped by month in the selected period</p>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {months.map(m=>(
          <div key={m.key} className="bg-secondary/40 border border-border rounded-lg p-4 space-y-2">
            <p className="text-xs font-bold text-foreground">{monthLabel(m.key)}</p>
            <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-[11px]">
              <div><span className="text-muted-foreground">MB: </span><span className="font-bold text-foreground">{m.meetings}</span></div>
              <div><span className="text-muted-foreground">Replies: </span><span className="font-semibold text-foreground">{m.replies}</span></div>
              <div><span className="text-muted-foreground">PRs: </span><span className="font-semibold text-foreground">{m.pos}</span></div>
              <div><span className="text-muted-foreground">Sent: </span><span className="font-semibold text-foreground">{m.sent.toLocaleString()}</span></div>
              {m.replyRate!==null && <div className="col-span-2"><span className="text-muted-foreground">Reply Rate: </span><span className="font-semibold text-foreground">{m.replyRate}%</span></div>}
            </div>
            {m.topVertical!=='—' && (
              <div className="pt-1 border-t border-border text-[10px] text-muted-foreground">
                🏆 <span className="font-medium text-foreground">{m.topVertical}</span>{m.topReason && <span className="ml-1">— {m.topReason}</span>}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

const ROLE_TEAM = 'team';

function readSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return false;
    const {expiresAt} = JSON.parse(raw);
    return Date.now() < expiresAt;
  }catch{ return false; }
}
function readRole(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const {role} = JSON.parse(raw);
    return role || ROLE_TEAM;
  }catch{ return null; }
}
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

        )}
      </div>
      <AMModal am={amModal} allFacts={allFacts} filteredFacts={filtered} onClose={()=>setAmModal(null)}/>
      {loginOpen && <ManagerLoginModal onSuccess={r=>{setRole(r); setLoginOpen(false);}} onCancel={()=>setLoginOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard/>);
</script>
</body>
</html>
